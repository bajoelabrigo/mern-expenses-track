# Configuración de despliegue del frontend en Netlify.
# La API vive en otro servicio (Render): su URL se define en la variable de
# entorno VITE_API_URL desde el panel de Netlify.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Aplicación de una sola página: cualquier ruta devuelve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad (helmet cubre la API; esto cubre los archivos estáticos)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Los archivos con hash en el nombre se pueden cachear indefinidamente
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El service worker y el manifest NUNCA se cachean: si el navegador guardara
# una copia vieja de sw.js, los móviles no recibirían las versiones nuevas.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# El APK que se ofrece en /descargas. Con su tipo correcto, Android lo reconoce
# como aplicación en vez de como un archivo cualquiera.
[[headers]]
  for = "/descargas/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Cache-Control = "public, max-age=86400"

# Verificación de la app Android (Trusted Web Activity): Android descarga este
# archivo para confirmar que el APK es de este sitio y abrirlo sin barra de
# dirección. Debe servirse como JSON.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
